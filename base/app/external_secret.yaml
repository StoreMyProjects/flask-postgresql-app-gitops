apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: redis-secret
  data:
  - secretKey: REDIS_HOST
    remoteRef:
      key: redis-secrets
      property: host
  - secretKey: REDIS_PORT
    remoteRef:
      key: redis-secrets
      property: port
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: redis-secrets
      property: password