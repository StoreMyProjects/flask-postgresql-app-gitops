apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate

metadata:
  name: pod-health-check

spec:
  metrics:
  - name: pod-restarts
    provider:
      prometheus:
        query: |
          sum(
            increase(
              kube_pod_container_status_restarts_total{
                namespace="dev",
                pod=~"two-tier-app.*"
              }[2m]
            )
          )